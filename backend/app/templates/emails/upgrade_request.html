{% extends "base.html" %}

{% block content %}
  <h2 style="color:#1e3a5f;margin-top:0">Plan Upgrade Request</h2>
  <table style="width:100%;border-collapse:collapse;font-size:14px">
    <tr>
      <td style="padding:8px 0;color:#64748b">User</td>
      <td><strong>{{ user_name }}</strong> ({{ user_email }})</td>
    </tr>
    <tr>
      <td style="padding:8px 0;color:#64748b">Plan</td>
      <td><strong>{{ plan }}</strong> - {{ price }}</td>
    </tr>
    <tr>
      <td style="padding:8px 0;color:#64748b">UTR / Ref</td>
      <td><code>{{ utr }}</code></td>
    </tr>
    {% if note %}
      <tr>
        <td style="padding:8px 0;color:#64748b">Note</td>
        <td>{{ note }}</td>
      </tr>
    {% endif %}
  </table>
  <p style="color:#64748b;font-size:13px;margin-top:20px">Verify the UTR in your bank app, then set the plan in the admin panel.</p>
{% endblock %}
