{% extends "base.html" %}

{% block content %}
  <h2 style="color:#1e3a5f;margin-top:0">Reset your password</h2>
  <p>We received a request to reset the password for your {{ app_name }} account.</p>
  <p>Click the button below. This link expires in <strong>1 hour</strong>.</p>
  <p style="text-align:center;margin:28px 0">
    <a href="{{ reset_url }}" style="display:inline-block;padding:12px 28px;background:#1e3a5f;color:#fff;border-radius:6px;text-decoration:none;font-weight:600">Reset Password</a>
  </p>
  <p style="color:#64748b;font-size:13px">If you did not request this, you can safely ignore this email.</p>
{% endblock %}
